<html>

<head></head>

<body onload="init()">
    <video id="vid" muted="muted" preload="none" width="300" height="300"></video>
    <script>

        async function init(e) {


            const parametros = new URLSearchParams(window.location.search)

            const id = parametros.get("id")

            const video = document.getElementById("vid")

            const socket = await new WebSocket("wss://videosharer.onrender.com/screen/"+id)

            const mSource = new MediaSource()
            const url = URL.createObjectURL(mSource);
            video.src = url

            

            let videoSourceBuffer = 0

            let firstController = 0

            let lastVideoTime = 0;

            


            socket.onmessage = async function (event) {
               

                event.data.arrayBuffer().then(async data => {

                    if (firstController == 0) {

                        videoSourceBuffer = mSource.addSourceBuffer('video/webm; codecs=vp9');
                        videoSourceBuffer.mode = "sequence"


                        await videoSourceBuffer.appendBuffer(new Int8Array(data))


                        firstController++

                        

                    } else if (firstController == 1) {

                        //videoData.push(new Uint8Array(data))
                        firstController++

                        await videoSourceBuffer.appendBuffer(new Int8Array(data))
                        videoSourceBuffer.addEventListener('updateend', function (_) {
                            mSource.endOfStream()
                            video.play()
                        });

                        setInterval(function(){

                            console.log(video.currentTime)

                            if(lastVideoTime == video.currentTime){
                                video.currentTime += 0.01
                            }

                            lastVideoTime = video.currentTime

                        },1000)

                        //video.play()


                    } else {
                        await videoSourceBuffer.appendBuffer(new Int8Array(data))

                        console.log(videoSourceBuffer)

                        
                    }


                })

            }
