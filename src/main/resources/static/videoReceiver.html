        async function init(e) {

            const parametros = new URLSearchParams(window.location.search)
 
            const id = parametros.get("id")

            // Conecta ao mesmo canal do WebSocket
            const receptorSocket = new WebSocket(`wss://videosharer.onrender.com/ws/screen/${id}`);

            // Define o tipo de dado binário esperado (deve ser igual ao do emissor)
            receptorSocket.binaryType = 'arraybuffer';

            const imgElement = document.getElementById('transmissao');
            let urlAnterior = null;

            receptorSocket.onmessage = function (event) {
                // 1. Recebe o ArrayBuffer enviado pelo servidor
                const arrayBuffer = event.data;

                // 2. Cria um Blob especificando o formato de imagem (JPEG, conforme enviado no canvas)
                const blob = new Blob([arrayBuffer], {type: 'image/jpeg'});

                // 3. Cria uma URL temporária apontando para esse Blob na memória
                const novaUrl = URL.createObjectURL(blob);

                // 4. Substitui a imagem atual na tela
                imgElement.src = novaUrl;

                // 5. Otimização de Memória: Libera a URL antiga para não travar o navegador
                if (urlAnterior) {
                    URL.revokeObjectURL(urlAnterior);
                }
                urlAnterior = novaUrl;
            };

            // Tratamento de erros opcional para monitorar a conexão
            receptorSocket.onerror = function (error) {
                console.error("Erro no WebSocket receptor:", error);
            };

        }

        
        window.addEventListener('beforeunload', (event) => {
            socket.close()
        });
