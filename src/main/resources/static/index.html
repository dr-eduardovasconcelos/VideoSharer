<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoSharer - Transmissões ao Vivo</title>
    <!-- Tailwind CSS e DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-200 text-base-content" onload="load()">

    <!-- Navbar -->
    <div class="navbar bg-base-100 shadow-md px-6">
        <div class="flex-1">
            <a class="btn btn-ghost text-xl text-primary font-bold">VideoSharer</a>
        </div>
        <div class="flex-none gap-2">
            <form name="formCamera">
            <input type="text" name="cameraIn" placeholder="Digite o ID da transmissão" class="input input-bordered"/>
            <button class="btn btn-primary btn-sm live">Iniciar Live</button>
            </form>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <main class="container mx-auto p-6">
        <div class="mb-8 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight">Transmissões ao Vivo</h1>
                <p class="text-sm opacity-70">Acompanhe quem está transmitindo agora mesmo.</p>
            </div>
            <div class="badge badge-error gap-2 text-white font-medium">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                </span>
                Ao Vivo
            </div>
        </div>

        <!-- Lista de Transmissões (Cards) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="grid">
            
            <!-- Card de Transmissão 1 -->
            <div class="card bg-base-100 shadow-xl border border-base-300" id="card">
                <figure class="relative bg-black h-48 flex items-center justify-center">
                    <span class="badge badge-error absolute top-3 left-3 text-white text-xs">AO VIVO</span>
                    <span class="text-xs opacity-50 text-white">[Pré-visualização do Vídeo]</span>
                </figure>
                <div class="card-body p-5">
                    <div class="flex items-center gap-3 mb-2">
                        <div class="avatar placeholder">
                            <div class="bg-neutral text-neutral-content rounded-full w-10">
                                <span class="text-xs">JS</span>
                            </div>
                        </div>
                        <div>
                            <h2 class="card-title text-base font-bold">__numero__</h2>
                            <p class="text-xs opacity-70">__id__</p>
                        </div>
                    </div>
                    <div class="card-actions justify-end mt-3">
                        <a href="videoReceiver.html?id=__idlink__" class="btn btn-primary btn-sm w-full">Assistir Live</a>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const load = async function(){

            const response = await fetch("https://videosharer.onrender.com/api/rest/ids",{
                method:"Get",
                'content-type':'application/json'
            })

            const list = await response.json()

            const grid = document.getElementById("grid")

            const card = document.getElementById("card").innerHTML

            document.getElementById("card").remove()

            list.forEach((element,index) => {
                
                let innerCard = card.replace("__numero__",index)
                innerCard = innerCard.replace("__id__", element)
                innerCard = innerCard.replace("__idlink__", element)

                grid.innerHTML += innerCard

            });

        }

        document.forms["formCamera"].addEventListener("submit", function(event){

            event.preventDefault()
            
            const formData = new FormData(event.target)

            const data = {}

                alert("é preciso definir um id")
            }else{
                location.href="cameraSender.html?id="+data.cameraIn
            }
        })
    </script>

</body>
</html>
